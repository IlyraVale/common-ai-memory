[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "common-ai-memory"
version = "0.1.0"
description = "Shared memory, games, and a multi-AI lounge"
requires-python = ">=3.10"
dependencies = ["mcp>=2.1,<3"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
common-ai-memory = "launcher:main"
common-ai-memory-atrium = "memory_atrium:main"
common-ai-memory-games = "minigames_viewer:main"
common-ai-memory-lounge = "lounge_viewer:main"
common-ai-memory-bridge = "lounge_bridge:main"

[tool.setuptools]
py-modules = ["category_policy", "config", "external_games", "game_hall", "launcher", "lounge_attachments", "lounge_bridge", "lounge_room", "lounge_viewer", "memory_atrium", "memory_audit", "memory_house", "memory_store", "minigames", "minigames_gomoku_core", "minigames_viewer", "server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
