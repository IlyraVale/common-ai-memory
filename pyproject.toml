[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "common-ai-memory"
dynamic = ["version"]
description = "Local-first shared long-term memory for AI assistants over MCP, with a local UI"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
authors = [{name = "Ilyra"}]
requires-python = ">=3.10,<3.11"
keywords = ["mcp", "memory", "ai", "local-first", "markdown"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Operating System :: OS Independent",
]
dependencies = ["mcp>=2.1,<3"]

[project.optional-dependencies]
test = ["pytest>=8"]
semantic = ["fastembed>=0.8,<0.9"]

[project.scripts]
common-ai-memory = "launcher:main"
common-ai-memory-mcp = "server:main"
common-ai-memory-atrium = "memory_atrium:main"
common-ai-memory-games = "minigames_viewer:main"
common-ai-memory-lounge = "lounge_viewer:main"
common-ai-memory-bridge = "lounge_bridge:main"
common-ai-memory-dream-nightly = "dream_nightly:main"
common-ai-memory-doctor = "memory_doctor:main"
common-ai-memory-duplicates = "memory_duplicates:main"
common-ai-memory-manager = "memory_manager:main"
common-ai-memory-ui = "memory_ui:main"
common-ai-memory-services = "memory_services:main"
common-ai-memory-receipt = "execution_receipts:main"
common-ai-memory-provenance = "memory_provenance:main"
common-ai-memory-search = "memory_search:main"
common-ai-memory-vectors = "memory_vectors:main"

[tool.setuptools]
py-modules = ["archive_store", "category_policy", "config", "dream_cli_runner", "dream_nightly", "dream_scraps", "dreams", "execution_receipts", "external_games", "game_hall", "handoffs", "launcher", "lounge_attachments", "lounge_bridge", "lounge_room", "lounge_viewer", "memory_atrium", "memory_audit", "memory_doctor", "memory_duplicates", "memory_feedback", "memory_house", "memory_manager", "memory_provenance", "memory_search", "memory_services", "memory_store", "memory_ui", "memory_vectors", "memory_witness", "minigames", "minigames_gomoku_core", "minigames_viewer", "server", "timeline"]

[tool.setuptools.dynamic]
version = {attr = "config.__version__"}

[project.urls]
Repository = "https://github.com/IlyraVale/common-ai-memory"

[tool.pytest.ini_options]
testpaths = ["tests"]
